# Install with: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# Hooks run through uv so they use the exact tool versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        language: pygrep
        entry: '\A(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S'
        args: [--negate, --multiline]
        stages: [commit-msg]
