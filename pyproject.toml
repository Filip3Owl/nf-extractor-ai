[project]
name = "nf-extractor-ai"
version = "0.1.0"
description = "AI pipeline that turns unstructured documents into validated, structured data using OCR, layout analysis, and vision LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Filipe Rangel" }]
requires-python = ">=3.12,<3.15"
keywords = ["document-ai", "computer-vision", "llm", "nf-e", "nota-fiscal", "data-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.3,<3",
    "httpx2>=2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Free local OCR. OpenVINO runs the models because onnxruntime has no wheels for Intel Macs.
ocr = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<4.11",
    "openvino>=2024.4,<2026",
    "pypdfium2>=4.30,<5.12",
    "rapidocr>=3.0,<4",
]
# Renders PDFs as images for the public LLM APIs, most of which accept only images.
vision = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<4.11",
    "pypdfium2>=4.30,<5.12",
]
# Synthetic dataset generation and the evaluation harness.
eval = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<4.11",
    "pypdfium2>=4.30,<5.12",
    "reportlab>=4.2",
]

[project.urls]
Repository = "https://github.com/Filip3Owl/nf-extractor-ai"
Issues = "https://github.com/Filip3Owl/nf-extractor-ai/issues"
Changelog = "https://github.com/Filip3Owl/nf-extractor-ai/blob/main/CHANGELOG.md"

[project.scripts]
nf-extractor = "nf_extractor.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Keeps Intel Macs on macOS 12 supported. Recent OpenVINO, pypdfium2 and OpenCV releases have no
# wheels for them, which is why those dependencies have upper bounds. Building OpenCV from source
# takes a very long time, so it is never allowed.
no-build-package = ["opencv-python-headless"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/nf_extractor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "D", "N", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidocr.*", "reportlab.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not ocr' --cov=nf_extractor --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["ocr: runs the real OCR models, which are downloaded on first use"]
